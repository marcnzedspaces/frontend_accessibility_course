<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Inaccessible Version</title>
    <link rel="stylesheet" href="css/day1-shared.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
            background: #f5f5f5;
        }

        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }

        button {
            background: #0066cc;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }

        .error-message {
            color: #c00;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .required {
            color: red;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Contact Us</h1>

        <form>
            <!-- Name field - NO LABEL -->
            <div class="form-group">
                <input type="text" placeholder="Your Name">
            </div>

            <!-- Email field - NO LABEL -->
            <div class="form-group">
                <input type="email" placeholder="Email Address">
            </div>

            <!-- Message field - NO LABEL, NO VISIBLE TEXT -->
            <div class="form-group">
                <textarea placeholder="Message" rows="5"></textarea>
            </div>

            <!-- Phone field with associated error but no aria-describedby -->
            <div class="form-group">
                <input type="tel" placeholder="Phone (optional)">
                <div class="error-message">Phone must be in format: (123) 456-7890</div>
            </div>

            <!-- Dropdown field - NO LABEL -->
            <div class="form-group">
                <select>
                    <option value="">-- Select a topic --</option>
                    <option value="support">Support</option>
                    <option value="sales">Sales</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Required field not clearly marked programmatically -->
            <div class="form-group">
                <input type="text" placeholder="Company (required)">
                <span class="required">*</span>
            </div>

            <!-- Checkbox with no associated label -->
            <div class="form-group">
                <input type="checkbox"> I agree to the terms
            </div>

            <!-- Submit button with unclear purpose -->
            <button type="submit">Go</button>
        </form>
    </div>
</body>
</html>
