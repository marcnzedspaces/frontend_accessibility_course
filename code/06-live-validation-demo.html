<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Validation Discussion Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Live Validation Discussion Demo</h1>

    <p>
      This example validates after the field loses focus. Discuss whether validation while typing would be helpful or noisy.
    </p>

    <form novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <p id="email-help" class="hint">
          Example format: name@example.com.
        </p>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          aria-describedby="email-help">

        <p id="email-error" class="error" hidden></p>
      </div>

      <button type="submit">Continue</button>
    </form>
  </main>

  <script>
    const email = document.getElementById("email");
    const error = document.getElementById("email-error");

    email.addEventListener("blur", () => {
      const value = email.value.trim();

      if (value && !value.includes("@")) {
        error.textContent = "Enter an email address in the format name@example.com.";
        error.hidden = false;
        email.setAttribute("aria-invalid", "true");
        email.setAttribute("aria-describedby", "email-help email-error");
      } else {
        error.textContent = "";
        error.hidden = true;
        email.removeAttribute("aria-invalid");
        email.setAttribute("aria-describedby", "email-help");
      }
    });
  </script>
</body>
</html>
