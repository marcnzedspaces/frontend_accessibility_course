<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Registration Form Solution</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Accessible Registration Form</h1>

    <p class="required-note">
      Fields marked with <span aria-hidden="true">*</span> are required.
    </p>

    <div id="error-summary" class="error-summary" role="alert" aria-labelledby="error-summary-title" tabindex="-1" hidden>
      <h2 id="error-summary-title">There is a problem</h2>
      <ul id="error-list"></ul>
    </div>

    <form id="registration-form" novalidate>
      <div class="field">
        <label for="full-name">Full name <span aria-hidden="true">*</span></label>
        <input id="full-name" name="fullName" type="text" autocomplete="name" required>
        <p id="full-name-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="email">Email address <span aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p id="email-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <p id="phone-help" class="hint">Include country code if outside Malaysia.</p>
        <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-help">
        <p id="phone-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password <span aria-hidden="true">*</span></label>
        <p id="password-help" class="hint">Use at least 12 characters.</p>
        <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-help">
        <p id="password-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password <span aria-hidden="true">*</span></label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>
        <p id="confirm-password-error" class="error" hidden></p>
      </div>

      <fieldset>
        <legend>Preferred contact method <span aria-hidden="true">*</span></legend>

        <label>
          <input type="radio" name="contact" value="email" required>
          Email
        </label>

        <br>

        <label>
          <input type="radio" name="contact" value="phone">
          Phone
        </label>

        <p id="contact-error" class="error" hidden></p>
      </fieldset>

      <div class="field">
        <label>
          <input id="terms" name="terms" type="checkbox" required>
          I agree to the terms and conditions <span aria-hidden="true">*</span>
        </label>
        <p id="terms-error" class="error" hidden></p>
      </div>

      <button type="submit">Submit registration</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("registration-form");
    const summary = document.getElementById("error-summary");
    const errorList = document.getElementById("error-list");

    const validations = [
      {
        id: "full-name",
        errorId: "full-name-error",
        validate(input) {
          return input.value.trim() ? "" : "Enter your full name.";
        }
      },
      {
        id: "email",
        errorId: "email-error",
        validate(input) {
          if (!input.value.trim()) return "Enter your email address.";
          if (!input.value.includes("@")) return "Enter an email address in the format name@example.com.";
          return "";
        }
      },
      {
        id: "password",
        errorId: "password-error",
        extraDescribedBy: "password-help",
        validate(input) {
          if (!input.value.trim()) return "Enter a password.";
          if (input.value.length < 12) return "Password must be at least 12 characters.";
          return "";
        }
      },
      {
        id: "confirm-password",
        errorId: "confirm-password-error",
        validate(input) {
          const password = document.getElementById("password").value;
          if (!input.value.trim()) return "Confirm your password.";
          if (input.value !== password) return "Passwords must match.";
          return "";
        }
      },
      {
        id: "terms",
        errorId: "terms-error",
        validate(input) {
          return input.checked ? "" : "Agree to the terms and conditions.";
        }
      }
    ];

    function clearErrors() {
      summary.hidden = true;
      errorList.innerHTML = "";

      validations.forEach(({ id, errorId, extraDescribedBy }) => {
        const input = document.getElementById(id);
        const error = document.getElementById(errorId);
        input.removeAttribute("aria-invalid");

        if (extraDescribedBy) {
          input.setAttribute("aria-describedby", extraDescribedBy);
        } else {
          input.removeAttribute("aria-describedby");
        }

        error.hidden = true;
        error.textContent = "";
      });

      document.getElementById("contact-error").hidden = true;
      document.getElementById("contact-error").textContent = "";
    }

    function setFieldError(id, errorId, message, extraDescribedBy) {
      const input = document.getElementById(id);
      const error = document.getElementById(errorId);
      error.textContent = message;
      error.hidden = false;
      input.setAttribute("aria-invalid", "true");

      const describedBy = [extraDescribedBy, errorId].filter(Boolean).join(" ");
      input.setAttribute("aria-describedby", describedBy);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      clearErrors();

      const errors = [];

      validations.forEach(({ id, errorId, validate, extraDescribedBy }) => {
        const input = document.getElementById(id);
        const message = validate(input);
        if (message) {
          setFieldError(id, errorId, message, extraDescribedBy);
          errors.push({ id, message });
        }
      });

      const contactSelected = form.querySelector('input[name="contact"]:checked');
      if (!contactSelected) {
        const error = document.getElementById("contact-error");
        error.textContent = "Choose your preferred contact method.";
        error.hidden = false;
        errors.push({ id: "contact-error", message: "Choose your preferred contact method." });
      }

      if (errors.length > 0) {
        errors.forEach(({ id, message }) => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = `#${id}`;
          link.textContent = message;
          li.appendChild(link);
          errorList.appendChild(li);
        });

        summary.hidden = false;
        summary.focus();
        return;
      }

      alert("Registration submitted successfully.");
    });
  </script>
</body>
</html>
