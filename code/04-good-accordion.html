<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Good Accordion Example</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Good Accordion Example</h1><p>This disclosure pattern uses real buttons and communicates expanded or collapsed state.</p><section><h2>Frequently Asked Questions</h2><button type="button" aria-expanded="false" aria-controls="answer1" id="question1">What is included in this course?</button><div id="answer1" class="panel" hidden><p>The course includes semantic HTML, forms, dialogs, and SPA patterns.</p></div><button type="button" aria-expanded="false" aria-controls="answer2" id="question2">Do we use React or Angular?</button><div id="answer2" class="panel" hidden><p>We discuss framework patterns after learning the native HTML behaviour.</p></div></section></main><script>document.querySelectorAll('button[aria-expanded]').forEach((b)=>{b.addEventListener('click',()=>{const p=document.getElementById(b.getAttribute('aria-controls'));const ex=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!ex));p.hidden=ex;});});</script></body></html>
