<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="big-title">Registration Form</div>

    <form>
      <p>Name</p>
      <input type="text">

      <p>Email</p>
      <input type="text">

      <p>Phone</p>
      <input type="text">

      <p>Password *</p>
      <input type="password">

      <p>Preferred contact method</p>
      <input type="radio" name="contact" value="email"> Email
      <input type="radio" name="contact" value="phone"> Phone

      <p>
        <input type="checkbox">
        I agree to the terms
      </p>

      <div class="fake-button" onclick="alert('Submitted')">
        Submit
      </div>
    </form>
  </main>
</body>
</html>
