<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Good Dialog Example</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Good Dialog Example</h1><p>This example uses the native dialog element and manages focus return.</p><button type="button" id="open-dialog">Open registration details</button><p><a href="#background-link">Background link for testing</a></p><dialog id="registration-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">Registration details</h2><p>This dialog contains registration information. Focus moves into the dialog and returns to the trigger after closing.</p><button type="button" id="close-dialog">Close</button></dialog></main><script>const openButton=document.getElementById('open-dialog');const dialog=document.getElementById('registration-dialog');const closeButton=document.getElementById('close-dialog');openButton.addEventListener('click',()=>{dialog.showModal();closeButton.focus();});closeButton.addEventListener('click',()=>{dialog.close();openButton.focus();});dialog.addEventListener('close',()=>{openButton.focus();});</script></body></html>
