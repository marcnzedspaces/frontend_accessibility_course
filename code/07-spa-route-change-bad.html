<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Training App</title><link rel="stylesheet" href="styles.css"></head><body><header><p>Training App</p><nav aria-label="Main navigation"><button type="button" onclick="showPage('home')">Home</button><button type="button" onclick="showPage('courses')">Courses</button><button type="button" onclick="showPage('contact')">Contact</button></nav></header><main id="main-content" class="route-content"><h1>Home</h1><p>Welcome to the training app.</p></main><script>const pages={home:{title:'Home',body:'Welcome to the training app.'},courses:{title:'Courses',body:'Browse available accessibility courses.'},contact:{title:'Contact',body:'Contact the training team.'}};function showPage(pageName){const page=pages[pageName];document.getElementById('main-content').innerHTML=`<h1>${page.title}</h1><p>${page.body}</p>`;}</script></body></html>
