<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Home | Training App</title><link rel="stylesheet" href="styles.css"></head><body><a class="skip-link" href="#main-content">Skip to main content</a><header><p>Training App</p><nav aria-label="Main navigation"><ul><li><button type="button" data-route="home" aria-current="page">Home</button></li><li><button type="button" data-route="courses">Courses</button></li><li><button type="button" data-route="contact">Contact</button></li></ul></nav></header><main id="main-content" class="route-content" tabindex="-1"><h1 tabindex="-1">Home</h1><p>Welcome to the training app.</p></main><script>const pages={home:{title:'Home',documentTitle:'Home | Training App',body:'Welcome to the training app.'},courses:{title:'Courses',documentTitle:'Courses | Training App',body:'Browse available accessibility courses.'},contact:{title:'Contact',documentTitle:'Contact | Training App',body:'Contact the training team.'}};const main=document.getElementById('main-content');const buttons=document.querySelectorAll('[data-route]');function setCurrent(route){buttons.forEach(b=>{b.dataset.route===route?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');});}function showPage(route){const p=pages[route];document.title=p.documentTitle;main.innerHTML=`<h1 tabindex="-1">${p.title}</h1><p>${p.body}</p>`;setCurrent(route);main.querySelector('h1').focus();}buttons.forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.route)));</script></body></html>
