<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Responsive Navigation and Tooltip Starter</title><link rel="stylesheet" href="styles.css"></head><body><header><p>Training Portal</p><div class="fake-button" onclick="toggleMenu()">Menu</div><div id="mobile-menu" style="display:none"><span class="fake-link" onclick="location.href='#home'">Home</span><span class="fake-link" onclick="location.href='#courses'">Courses</span><span class="fake-link" onclick="location.href='#contact'">Contact</span></div></header><main><h1>Responsive Navigation and Tooltip Starter</h1><p>Improve the responsive navigation and help text pattern.</p><div class="field"><label for="username">Username</label><input id="username" name="username" type="text"><span class="tooltip">Use 6 to 20 characters.</span></div></main><script>function toggleMenu(){const menu=document.getElementById('mobile-menu');menu.style.display=menu.style.display==='none'?'block':'none';}</script></body></html>
