<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Challenge Starter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Final Challenge: Registration Form</h1>

    <p>Improve this form using today’s accessible form patterns.</p>

    <form>
      <p>Full name *</p>
      <input type="text">

      <p>Email *</p>
      <input type="text">

      <p>Phone</p>
      <input type="text">

      <p>Password *</p>
      <input type="password">

      <p>Confirm password *</p>
      <input type="password">

      <p>Preferred contact method *</p>
      <input type="radio" name="contact" value="email"> Email
      <input type="radio" name="contact" value="phone"> Phone

      <p>
        <input type="checkbox">
        I agree to the terms
      </p>

      <div class="fake-button" onclick="alert('Submitted')">Submit</div>
    </form>
  </main>
</body>
</html>
