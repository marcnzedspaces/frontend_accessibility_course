<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Bad Accordion Example</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Bad Accordion Example</h1><p>This accordion is intentionally broken for accessibility testing.</p><div class="fake-accordion-trigger" onclick="togglePanel('answer1')">What is included in this course?</div><div id="answer1" class="panel" style="display:none"><p>The course includes semantic HTML, forms, dialogs, and SPA patterns.</p></div><div class="fake-accordion-trigger" onclick="togglePanel('answer2')">Do we use React or Angular?</div><div id="answer2" class="panel" style="display:none"><p>We discuss framework patterns after learning the native HTML behaviour.</p></div></main><script>function togglePanel(id){const p=document.getElementById(id);p.style.display=p.style.display==='none'?'block':'none';}</script></body></html>
