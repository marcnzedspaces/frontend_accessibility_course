<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Interactive Page</title><link rel="stylesheet" href="styles.css"></head><body><div class="header"><div>Training Portal</div><div class="menu"><span class="fake-link" onclick="showPage('overview')">Overview</span><span class="fake-link" onclick="showPage('faq')">FAQ</span><span class="fake-link" onclick="showPage('register')">Register</span></div></div><div class="breadcrumb">Home &gt; Courses &gt; Accessibility</div><div id="main"><div class="big-title">Overview</div><p>Welcome to the interactive page challenge.</p><div class="fake-accordion-trigger" onclick="togglePanel()">What is included?</div><div id="panel" style="display:none"><p>The course includes navigation, accordions, dialogs, and SPA patterns.</p></div><div class="fake-button" onclick="openModal()">Open details</div></div><div id="modal-backdrop" class="dialog-backdrop" style="display:none"></div><div id="modal" class="fake-modal" style="display:none"><div class="section-title">Details</div><p>This is a visual modal without proper focus management.</p><span class="fake-link" onclick="closeModal()">Close</span></div><script>function togglePanel(){const p=document.getElementById('panel');p.style.display=p.style.display==='none'?'block':'none';}function openModal(){document.getElementById('modal-backdrop').style.display='block';document.getElementById('modal').style.display='block';}function closeModal(){document.getElementById('modal-backdrop').style.display='none';document.getElementById('modal').style.display='none';}function showPage(name){document.getElementById('main').innerHTML=`<div class="big-title">${name}</div><p>Content changed, but focus and title did not update.</p>`;}</script></body></html>
