<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Bad Dialog Example</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Bad Dialog Example</h1><p>This modal is intentionally broken for accessibility testing.</p><button type="button" onclick="openModal()">Open registration details</button><p><a href="#background-link">Background link that should not be reachable when modal is open</a></p><div id="modal-backdrop" class="dialog-backdrop" style="display:none"></div><div id="fake-modal" class="fake-modal" style="display:none"><div class="section-title">Registration details</div><p>This modal appears visually, but focus is not managed correctly.</p><span class="fake-link" onclick="closeModal()">Close</span></div></main><script>function openModal(){document.getElementById('modal-backdrop').style.display='block';document.getElementById('fake-modal').style.display='block';}function closeModal(){document.getElementById('modal-backdrop').style.display='none';document.getElementById('fake-modal').style.display='none';}</script></body></html>
